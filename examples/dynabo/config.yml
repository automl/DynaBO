PY_EXPERIMENTER:
  n_jobs: 1

  Database:
    provider: sqlite
    database: examples/dynabo/dynabo
    table:
      name: dynabo_runs
      keyfields:
        scenario:
          type: VARCHAR(255)
        seed:
          type: INT
        n_trials:
          type: INT
      result_timestamps: False
      resultfields:
        final_cost: FLOAT
        runtime: FLOAT
    logtables:
      configs:
        cost: FLOAT
        incumbent: BOOLEAN
        configuration: TEXT
        after_n_evaluations: INT
        after_runtime: FLOAT
        after_virtual_runtime: FLOAT
        after_reasoning_runtime: FLOAT
        average_acquisition_function_impact: TEXT
        incumbent_acquisition_function_impact: TEXT
      priors:
        prior_accepted: BOOLEAN
        superior_configuration: BOOLEAN
        cost: FLOAT
        prior_mean_acq_value: FLOAT
        origin_mean_acq_value: FLOAT
        configuration: TEXT
        after_n_evaluations: INT
        after_runtime: FLOAT
        after_virtual_runtime: FLOAT
        after_reasoning_runtime: FLOAT
